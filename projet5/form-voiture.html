<!DOCTYPE html>

    <title>Ajout d'une voiture</title>

<body>
    <h1>Ajouter une voiture</h1>
    <form action="traitement_voiture.php" method="post">
        <label for="immat">Immatriculation</label>
        <input type="text" id="immat" name="immat">
