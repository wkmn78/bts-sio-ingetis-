<body>
<form action="#" method="post">
	<h1>Inscription Nouveau client</h1>
	<label for="nom">Nom</label>
	<input type="text" id ="nom"name="nom">
	<br><meta charset="utf-8">
	<label for="prenom">Prénom:</label>
	<input type="text" id="prenom" name="prenom">
	<br>
	<label for="email">Adresse mail:</label>
	<input type="email" id="email" name="emai" >
	<br>
<label for="mdp">Mot de passe:</label>
<input type="password" id=mpd name="mpd">
<label for="permis">Numéro de permis:</label> 
<input type="text"id=permis :<label name="permis">

	<input type="number" id="ancienete" name="ancienete" min="0" max="80">
	<br>
	<label for="ville">ville:</label>
	<select id="ville" name="ville">

		<option value="creteil ">creteil</option> </select>
		<br>
		<label for="Adresse">Adresse du client</label>
		<textarea id="Adresse"name ="Adresse" rows="4" cols="30"></textarea>
		<br>
<p>situation matrimoniale:</p>
<label for="marié_oui">Marié</label>
<input type="radio" id="marie-oui" name="marie" value="oui">
<label for="marie-non"> non marié </label>
<input type="radio" id="marie-non name="marie" value="non">
<br>
<p>Préférence de voiture</p>
<label for="pref_auto">automatique</label>
<input type="checkbox" id="pref_auto" name="preference_auto" value="automatique">
<label for="pref_manuelle">Manuelle</label>
<input type="checkbox" id="pref_manuelle" name="preference_manuelle" value="manuelle">
<br>
<button type="submit">Enregistrer</button>
<button type="reset">Annuler</button>
